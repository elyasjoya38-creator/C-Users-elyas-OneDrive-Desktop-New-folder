{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | PDC Portal</title><link rel="stylesheet" href="{% static 'enroll/css/portal.css' %}"></head>
<body class="auth-page"><main class="auth-card"><div class="auth-brand"><img src="{% static 'enroll/images/LOGO-GHU.png' %}" alt="Ghargistan University"><h1>PDC Portal</h1><p>Ghargistan University · Professional Development Center</p></div>
{% if messages %}{% for message in messages %}<div class="portal-message {{ message.tags }}" role="alert">{{ message }}</div>{% endfor %}{% endif %}
<form method="post" action="{% url 'login' %}">{% csrf_token %}{% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
<div class="auth-field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></div><div class="auth-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="portal-btn auth-submit" type="submit">Sign in</button></form>
<div class="auth-links">First time here? <a href="{% url 'register' %}">Create a student account</a></div></main></body></html>
