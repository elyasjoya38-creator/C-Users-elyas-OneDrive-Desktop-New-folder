{% extends 'enroll/index.html' %}

{% block contents %}

<div class="panel">

    <h2>✏ Edit Student</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="primary" type="submit">
            Update Student
        </button>

        <a href="{% url 'student_list' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
