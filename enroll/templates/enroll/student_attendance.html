{% extends 'enroll/index.html' %}
{% block contents %}
<section class="hero"><h1>حاضری من</h1><p>سوابق حضور شما در کورس‌ها.</p></section>
<div class="panel"><div class="tablewrap"><table><thead><tr><th>کورس</th><th>تاریخ</th><th>وضعیت</th></tr></thead><tbody>{% for row in attendance %}<tr><td>{{ row.course.course_name }}</td><td>{{ row.date }}</td><td>{{ row.get_status_display }}</td></tr>{% empty %}<tr><td colspan="3">رکورد حاضری موجود نیست.</td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
