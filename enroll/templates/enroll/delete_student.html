{% extends 'enroll/index.html' %}

{% block contents %}

<div class="panel">

    <h2>🗑 Delete Student</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ student.full_name }}</strong> ?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button class="primary" type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'student_list' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
