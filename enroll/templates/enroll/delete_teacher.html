{% extends 'enroll/index.html' %}
{% block contents %}
<div class="panel">
  <h2>Delete teacher</h2>
  <p>Are you sure you want to delete <strong>{{ teacher.full_name }}</strong>?</p>
  <form method="post">{% csrf_token %}<button class="primary" type="submit">Delete</button></form>
  <a href="{% url 'teacher_list' %}">Cancel</a>
</div>
{% endblock %}
