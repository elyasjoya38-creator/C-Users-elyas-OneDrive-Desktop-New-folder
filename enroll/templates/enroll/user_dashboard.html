<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل اشتراک‌کننده | سیستم PDC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;font-family:Tahoma,Arial,sans-serif;color:#243247}
header{background:#155eaa;color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
main{max-width:980px;margin:42px auto;padding:0 18px}.card{background:white;border-radius:16px;padding:28px;box-shadow:0 8px 28px #17365d12}
h1{font-size:25px;margin:0 0 12px}.muted{color:#64748b;line-height:1.9}
a{color:#155eaa;text-decoration:none;font-weight:bold}.logout{color:white;border:1px solid #ffffff88;padding:9px 15px;border-radius:8px}
</style></head>
<body>
<header><strong>سیستم مدیریت مرکز توسعه حرفه‌ای دانشگاه غرجستان</strong>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="logout" type="submit">خروج از حساب</button></form></header>
<main><section class="card">
<h1>خوش آمدید، {{ request.user.get_username }}</h1>
<p class="muted">این پنل شخصی اشتراک‌کننده است. در این بخش فقط معلومات مربوط به حساب خودتان نمایش داده می‌شود.</p>
<p class="muted">امکانات ثبت‌نام در کورس‌ها و مشاهده وضعیت درخواست‌ها در مرحله بعدی توسعه اضافه خواهد شد.</p>
</section></main></body></html>
