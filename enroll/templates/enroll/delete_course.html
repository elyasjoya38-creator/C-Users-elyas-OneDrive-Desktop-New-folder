{% extends 'enroll/index.html' %}

{% block contents %}

<div class="panel">

    <h2>🗑 Delete Course</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ course.course_name }}</strong> ?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button class="primary" type="submit">
            Delete
        </button>

        <a href="{% url 'course_list' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
